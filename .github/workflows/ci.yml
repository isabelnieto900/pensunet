name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: ruff + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar el paquete con extras de desarrollo e interfaz
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Pruebas (pytest)
        run: pytest

  docker:
    name: construir la imagen Docker
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -t pensunet:ci .
      - name: Arranque y health check
        run: |
          docker run -d --name pensunet -p 8501:8501 pensunet:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          docker logs pensunet
          exit 1
