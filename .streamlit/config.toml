# Tema Pensunet · identidad web Universidad Distrital (sin escudo ni logo).
# Combinaciones: blanco/#8C1919, negro/#FDB400, #FDB400/negro, #8C1919/blanco.

[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#8C1919"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F5"
textColor = "#000000"
linkColor = "#8C1919"
borderColor = "#98999A"
dataframeHeaderBackgroundColor = "#8C1919"
dataframeHeaderTextColor = "#FFFFFF"
dataframeBorderColor = "#98999A"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "0.75rem"
buttonRadius = "0.75rem"
font = "Hind:https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&display=swap"
headingFont = "Titillium Web:https://fonts.googleapis.com/css2?family=Titillium+Web:wght@600;700&display=swap"
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontWeight = 700
linkUnderline = false
redColor = "#8C1919"
orangeColor = "#FDB400"
yellowColor = "#FDB400"
greenColor = "#00A859"
blueColor = "#1291C0"
grayColor = "#98999A"
chartCategoricalColors = ["#8C1919", "#FDB400", "#1291C0", "#00A859", "#98999A", "#373435"]
paddingTop = "1rem"
paddingBottom = "1.5rem"

