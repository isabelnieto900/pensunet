# Tema de Pensunet: papel cálido, verde azulado sobrio y acento terracota.
# Define variantes clara y oscura para que el selector de tema de Streamlit
# siga funcionando (Ajustes → Apariencia).

[server]
headless = true

[browser]
gatherUsageStats = false

[theme]
font = "'Source Sans 3', 'Segoe UI', sans-serif"
headingFont = "Fraunces, Georgia, serif"
baseRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#1F6F5B", "#B35C2E", "#1A5276", "#8E6C8A", "#B9770E", "#5D6D7E"]

[theme.light]
primaryColor = "#1F6F5B"
backgroundColor = "#FAF8F4"
secondaryBackgroundColor = "#EFEAE1"
textColor = "#1A2E28"
linkColor = "#1A5276"
borderColor = "#D9D2C5"
dataframeHeaderBackgroundColor = "#E6E0D4"

[theme.light.sidebar]
backgroundColor = "#F2EEE6"
secondaryBackgroundColor = "#E6E0D4"

[theme.dark]
primaryColor = "#4FB39A"
backgroundColor = "#101815"
secondaryBackgroundColor = "#18241F"
textColor = "#E6EEEA"
linkColor = "#8CC4E8"
borderColor = "#2A3A33"
dataframeHeaderBackgroundColor = "#1D2B25"

[theme.dark.sidebar]
backgroundColor = "#0C1311"
secondaryBackgroundColor = "#18241F"
