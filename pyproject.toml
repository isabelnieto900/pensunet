[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pensunet"
version = "0.1.0"
description = "Simulador de la red de prerrequisitos del pensum de Física (Molontay et al., 2020)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Laura Isabel Nieto Parroyo" },
]
keywords = ["pensum", "prerrequisitos", "fisica", "monte-carlo", "curriculo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "networkx",
    "pandas",
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
ui = ["streamlit"]

[project.urls]
Homepage = "https://github.com/isabelnieto900/pensunet"
Documentation = "https://github.com/isabelnieto900/pensunet/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
